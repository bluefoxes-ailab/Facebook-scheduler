<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator Studio | Team Publisher</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #00f2fe;
      --primary-hover: #4facfe;
      --gaming: #b122e5;
      --gaming-hover: #ff63de;
      --truecrime: #ff0844;
      --truecrime-hover: #ffb199;
      
      --glass-bg: rgba(25, 25, 35, 0.6);
      --glass-border: rgba(255, 255, 255, 0.15);
      --text-main: #ffffff;
      --text-muted: #b3b3b3;
      
      --success-bg: rgba(22, 163, 74, 0.2);
      --success-border: #4ade80;
      --error-bg: rgba(220, 38, 38, 0.2);
      --error-border: #f87171;
    }

    body {
      font-family: 'Poppins', sans-serif;
      
      background: linear-gradient(-45deg, #1a0b2e, #4a1942, #890c25, #0f172a, #2e0854);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    
    .container {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 550px;
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 30px;
      font-weight: 700;
      font-size: 1.8rem;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    .hidden { display: none !important; }

    
    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .btn:hover { transform: translateY(-3px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

    .login-btns { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
    .login-btns .btn { padding: 20px; font-size: 1.1rem; }
    
    .btn-gaming { 
      background: linear-gradient(135deg, var(--gaming), var(--gaming-hover));
      box-shadow: 0 10px 20px rgba(177, 34, 229, 0.3);
    }
    .btn-gaming:hover { box-shadow: 0 15px 25px rgba(177, 34, 229, 0.5); }
    
    .btn-crime { 
      background: linear-gradient(135deg, var(--truecrime), var(--truecrime-hover));
      box-shadow: 0 10px 20px rgba(255, 8, 68, 0.3);
    }
    .btn-crime:hover { box-shadow: 0 15px 25px rgba(255, 8, 68, 0.5); }
    
    .btn-submit { 
      background: linear-gradient(135deg, var(--primary), var(--primary-hover)); 
      width: 100%; 
      margin-top: 24px;
      color: #000;
      box-shadow: 0 10px 20px rgba(0, 242, 254, 0.3);
    }
    .btn-submit:hover { box-shadow: 0 15px 25px rgba(0, 242, 254, 0.5); }
    
    .btn-back { 
      background: rgba(255,255,255,0.05); 
      color: var(--text-muted); 
      width: 100%; 
      margin-top: 15px; 
      border: 1px solid var(--glass-border); 
    }
    .btn-back:hover { background: rgba(255,255,255,0.1); color: #fff; }

    
    .form-group { margin-bottom: 24px; }
    label { 
      display: block; 
      font-weight: 500; 
      margin-bottom: 10px; 
      font-size: 0.95rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
    
    select, textarea, input[type="text"], input[type="datetime-local"], input[type="password"]  {
      width: 100%;
      padding: 16px;
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 1rem;
      color: #fff;
      background: rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }
    
    select option { background: #1a1a2e; color: #fff; }
    
    select:focus, textarea:focus, input[type="datetime-local"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(0, 0, 0, 0.5);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
    }

    textarea { 
      resize: vertical; 
      min-height: 120px; 
      line-height: 1.6; 
      padding-right: 50px; 
    }

    
    .caption-wrapper {
      position: relative;
    }
    
    .emoji-btn {
      position: absolute;
      bottom: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s ease;
      z-index: 2;
    }

    .emoji-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.1);
    }

    
    .file-upload-wrapper {
      position: relative;
      border: 2px dashed rgba(255,255,255,0.3);
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      background: rgba(0, 0, 0, 0.2);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .file-upload-wrapper:hover {
      border-color: var(--primary);
      background: rgba(0, 242, 254, 0.05);
    }
    .file-upload-wrapper input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .file-upload-text {
      color: var(--text-muted);
      font-weight: 500;
    }
    .file-upload-text span {
      display: block;
      color: var(--primary);
      font-weight: 600;
      margin-top: 8px;
      font-size: 1.1rem;
    }

   
    .radio-group { 
      display: flex; 
      gap: 20px; 
      align-items: center; 
      background: rgba(0, 0, 0, 0.2);
      padding: 18px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
    }
    .radio-group label {
      margin: 0;
      display: flex;
      align-items: center;
      cursor: pointer;
      font-weight: 500;
      color: #fff;
    }
    .radio-group input[type="radio"] {
      margin-right: 10px;
      width: 20px;
      height: 20px;
      accent-color: var(--primary);
      cursor: pointer;
    }

   
    #statusMessage {
      margin-top: 24px;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      font-weight: 600;
      font-size: 0.95rem;
      animation: slideUp 0.3s ease-out;
      backdrop-filter: blur(5px);
    }
    .success { background-color: var(--success-bg); color: #fff; border: 1px solid var(--success-border); }
    .error { background-color: var(--error-bg); color: #fff; border: 1px solid var(--error-border); }

    
    .password-container { text-align: center; }
    .password-container input { margin-bottom: 20px; text-align: center; letter-spacing: 3px; font-size: 1.2rem; }
  
    .picmo-popup {
      background-color: #1a1a2e !important; 
      border-radius: 30px !important;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8) !important;
      border: 1px solid var(--glass-border) !important;
    }

    
    picmo-picker {
      background-color: #1a1a2e !important;
    }
  
  .checkbox-container {
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  padding: 12px;
  max-height: 200px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.checkbox-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  transition: background 0.2s ease;
  cursor: pointer;
}

.checkbox-item:hover {
  background: rgba(255, 255, 255, 0.05);
}

.checkbox-item input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: var(--primary);
  cursor: pointer;
}

.checkbox-item span {
  font-size: 0.95rem;
  color: #fff;
}

.select-all-btn {
  background: transparent;
  border: none;
  color: var(--primary);
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  padding: 0;
  margin-bottom: 8px;
  text-align: right;
  align-self: flex-end;
}

.select-all-btn:hover {
  text-decoration: underline;
}
:root {
  /* ...existing variables... */
  --news: #0072ff;
  --news-hover: #00c6ff;
}

.btn-news { 
  background: linear-gradient(135deg, var(--news), var(--news-hover));
  box-shadow: 0 10px 20px rgba(0, 114, 255, 0.3);
}
.btn-news:hover { box-shadow: 0 15px 25px rgba(0, 114, 255, 0.5); }

:root {
  /* Existing variables */
  --sports: #ff9800;
  --sports-hover: #ffb74d;
}

.btn-sports { 
  background: linear-gradient(135deg, var(--sports), var(--sports-hover));
  box-shadow: 0 10px 20px rgba(255, 152, 0, 0.3);
}
.btn-sports:hover { box-shadow: 0 15px 25px rgba(255, 152, 0, 0.5); }
  </style>
</head>
<body>


<div class="container" id="loginScreen">
  <h2>Select Workspace</h2>
  <div class="login-btns">
    <button class="btn btn-gaming" onclick="requestPassword('gaming')">🎮 Gaming </button>
    <button class="btn btn-crime" onclick="requestPassword('trueCrime')">🕵️ True Crime </button>
    <button class="btn btn-news" onclick="requestPassword('Karma')">👁️ Karma</button>
    <button class="btn btn-sports" onclick="requestPassword('sports')">🏅 Sports</button>
  </div>
</div>


<div class="container hidden" id="passwordScreen">
  <div class="password-container">
    <h2 id="passwordTitle">Enter Password</h2>
    <input type="password" id="teamPassword" placeholder="••••••••" onkeyup="checkEnterKey(event)">
    <button class="btn btn-submit" onclick="verifyPassword()">Unlock Workspace</button>
    <button class="btn btn-back" onclick="resetToLogin()">Cancel</button>
    <div id="passwordError" class="hidden error" style="margin-top: 15px; padding: 10px; border-radius: 8px;">Incorrect Password</div>
  </div>
</div>


<div class="container hidden" id="composerScreen">
  <h2 id="teamTitle">Composer</h2>
  
  <div class="form-group">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <label>Select Target Pages</label>
    <button type="button" class="select-all-btn" onclick="toggleSelectAll()">Select All</button>
  </div>
  <div class="checkbox-container" id="pageCheckboxList"></div>
</div>

  <div class="form-group">
    <label>Creative Asset</label>
    <div class="file-upload-wrapper">
      <div class="file-upload-text" id="fileUploadText">
        Drag & drop or click to browse
        <span>Video or Image file</span>
      </div>
      <input type="file" id="mediaUpload" accept="image/*,video/*" onchange="updateFileName()">
    </div>
  </div>

  <div class="form-group">
    <label for="caption">Post Caption</label>
    <div class="caption-wrapper">
      <textarea id="caption" placeholder="Write something engaging..."></textarea>
      
      <button type="button" class="emoji-btn" id="emojiBtn" title="Add Emoji">😀</button>
    </div>
  </div>

  <div class="form-group">
    <label for="universalId">Universal ID</label>
    <input type="text" id="universalId" placeholder="Add an asset management code">
  </div>

  <div class="form-group radio-group">
    <label><input type="radio" name="publishType" value="now" checked onchange="toggleSchedule()"> Publish Now</label>
    <label><input type="radio" name="publishType" value="schedule" onchange="toggleSchedule()"> Schedule Post</label>
  </div>

  <div class="form-group hidden" id="scheduleGroup">
    <label for="scheduleTime">Schedule Date & Time :</label>
    <input type="datetime-local" id="scheduleTime">
  </div>

  <button class="btn btn-submit" id="submitBtn" onclick="submitPost()">🚀 Launch Post</button>
  <button class="btn btn-back" onclick="resetToLogin()">Log Out / Switch Team</button>

  <div id="statusMessage" class="hidden"></div>
</div>

<script>
  
  
  

  const teamsData = {
    gaming: [
      { name: "Gamology - The Best of Gaming", id: "894332950616089"},
      { name: "Gamers on Board", id: "115642145136159" },
      { name: "Pixel Heroes", id: "158184731454410" },
      { name: "Gamer Forecast", id: "184753692121622"},
      { name: "Shift Fire", id: "104241008734361" },
      { name: "Gamology Asia", id: "1383863451698458" },
      { name: "Frags and Skills", id: "461052150760556" },
      { name: "Gamology - Creators Network +", id: "1429851870430172" },
      { name: "Sweet Memories", id: "132863274153701" }
    ],
    trueCrime: [
      { name: "Killer Bites", id: "107635881202158"},
      { name: "Binge Society - Dark", id: "111107098020809"},
      { name: "Fatal Files" , id: "101581832346980"}
    ],
    Karma: [
      { name: "Karma Moments", id: "114227735048877"},
      { name: "Karma Chronicles", id: "109971608789113"},
      { name: "Karma Central", id: "104262996056582"},
      { name: "Buzzer Beater", id: "1917462381705981"},
      { name: "Dark Chronicles", id: "117880948011569"},
      { name: "Binge TV", id: "111069038279400"},
      { name: "Mystic Chronicles", id: "100742323080074"},
      { name: "Supermission", id: "115090033689282"},
      { name: "Gadget Radar", id: "106037948551056"},
      { name: "Unbroken Chronicles", id: "100327096455522"},
      { name: "Protector Chronicles", id: "103817179282493"}
    ],
    sports: [
      { name: "Fight Source", id: "109559704772146"},
      { name: "Ultimate Freestyle", id: "522957638064464"}
    ]
  };

  let pendingTeam = "";
  let activeTeamData = [];

  


  function requestPassword(team) {
  pendingTeam = team;
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('passwordScreen').classList.remove('hidden');

  const titles = {
    gaming: '🎮 Gaming Login',
    trueCrime: '🕵️ True Crime Login',
    Karma: '👁️ Karma Login', // Add your new workspace key and display title here
    sports: '🏅 Sports Login'
  };

  document.getElementById('passwordTitle').innerText = titles[team] || 'Enter Password';

  document.getElementById('teamPassword').value = '';
  document.getElementById('passwordError').classList.add('hidden');
  document.getElementById('teamPassword').focus();
}

  function checkEnterKey(e) {
    if (e.key === 'Enter') verifyPassword();
  }

  async function verifyPassword() {
  const input = document.getElementById('teamPassword').value;
  
  const response = await fetch('/api/verify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ team: pendingTeam, password: input })
  });

  if (response.ok) {
   
    window.currentSessionPassword = input; 
    document.getElementById('passwordScreen').classList.add('hidden');
    loadComposer(pendingTeam);
  } else {
    const errorMsg = document.getElementById('passwordError');
    errorMsg.classList.remove('hidden');
  }
}

  function resetToLogin() {
    
    document.getElementById('passwordScreen').classList.add('hidden');
    document.getElementById('composerScreen').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    
    
    document.getElementById('caption').value = '';
    document.getElementById('universalId').value = '';
    
    
    document.getElementById('mediaUpload').value = '';
    updateFileName(); 
    
   
    document.getElementById('scheduleTime').value = '';
    
  
    document.querySelector('input[name="publishType"][value="now"]').checked = true;
    toggleSchedule(); 

    document.getElementById('statusMessage').classList.add('hidden');
    document.getElementById('statusMessage').textContent = '';
    
    pendingTeam = "";
  }

  let emojiPickerInstance = null;

  

  function updateFileName() {
    const fileInput = document.getElementById('mediaUpload');
    const uploadText = document.getElementById('fileUploadText');
    if (fileInput.files.length > 0) {
      uploadText.innerHTML = `Ready to launch: <span>${fileInput.files[0].name}</span>`;
    } else {
      uploadText.innerHTML = `Drag & drop or click to browse <span>Video or Image file</span>`;
    }
  }

  function toggleSchedule() {
    const isSchedule = document.querySelector('input[name="publishType"]:checked').value === 'schedule';
    const scheduleGroup = document.getElementById('scheduleGroup');
    if (isSchedule) {
      scheduleGroup.classList.remove('hidden');
    } else {
      scheduleGroup.classList.add('hidden');
      document.getElementById('scheduleTime').value = ''; 
    }
  }

  function showStatus(message, isError = false) {
    const statusEl = document.getElementById('statusMessage');
    statusEl.textContent = message;
    statusEl.className = isError ? 'error' : 'success';
    statusEl.classList.remove('hidden');
  }

  function loadComposer(team) {
  document.getElementById('composerScreen').classList.remove('hidden');

  const workspaceTitles = {
    gaming: '🎮 Gaming Workspace',
    trueCrime: '🕵️ True Crime Workspace',
    Karma: '👁️ Karma Workspace' ,// Add your new workspace key and title here
    sports: '🏅 Sports Workspace'
  };

  document.getElementById('teamTitle').innerText = workspaceTitles[team] || 'Composer';
  activeTeamData = teamsData[team] || [];

  // Render Page Checkboxes
  const listContainer = document.getElementById('pageCheckboxList');
  listContainer.innerHTML = '';

  activeTeamData.forEach((page) => {
    const label = document.createElement('label');
    label.className = 'checkbox-item';
    label.innerHTML = `
      <input type="checkbox" name="targetPages" value="${page.id}">
      <span>${page.name}</span>
    `;
    listContainer.appendChild(label);
  });

  // Emoji Picker initialization
  if (!emojiPickerInstance) {
    const button = document.querySelector('#emojiBtn');
    const captionInput = document.querySelector('#caption');

    import('https://cdn.jsdelivr.net/npm/@picmo/popup-picker@5.8.5/+esm')
      .then(module => {
        emojiPickerInstance = module.createPopup(
          { theme: 'dark' },
          { referenceElement: button, triggerElement: button, position: 'bottom-end' }
        );
        emojiPickerInstance.addEventListener('emoji:select', selection => {
          captionInput.value += selection.emoji;
        });
        button.addEventListener('click', () => {
          emojiPickerInstance.toggle();
        });
      })
      .catch(err => console.error("Emoji picker failed to load:", err));
  }
}

// Helper to select/deselect all pages at once
function toggleSelectAll() {
  const checkboxes = document.querySelectorAll('input[name="targetPages"]');
  const allChecked = Array.from(checkboxes).every(cb => cb.checked);
  checkboxes.forEach(cb => cb.checked = !allChecked);
}

async function submitPost() {
  // Collect all checked Page IDs
  const checkedBoxes = document.querySelectorAll('input[name="targetPages"]:checked');
  const selectedPageIds = Array.from(checkedBoxes).map(cb => cb.value);

  if (selectedPageIds.length === 0) {
    return showStatus("⚠️ Please select at least one page.", true);
  }

  const fileInput = document.getElementById('mediaUpload');
  const caption = document.getElementById('caption').value;
  const universalId = document.getElementById('universalId').value;
  const isSchedule = document.querySelector('input[name="publishType"]:checked').value === 'schedule';
  const scheduleTime = document.getElementById('scheduleTime').value;

  if (!fileInput.files.length) {
    return showStatus("⚠️ Please select a media asset to upload.", true);
  }

  const file = fileInput.files[0];
  const isVideo = file.type.includes('video');

  const formData = new FormData();
  formData.append('media', file);
  formData.append('team', pendingTeam);
  
  // Sends page IDs as a JSON array string: '["894332950616089", "115642145136159"]'
  formData.append('pageIds', JSON.stringify(selectedPageIds));
  
  formData.append('caption', caption);
  formData.append('password', window.currentSessionPassword);
  formData.append('isVideo', isVideo.toString());

  if (universalId.trim() !== "") {
    formData.append('universalId', universalId.trim());
  }

  if (isSchedule) {
    if (!scheduleTime) return showStatus("⚠️ Please select a time to schedule.", true);

    const scheduledDate = new Date(scheduleTime);
    const now = new Date();
    const diffMinutes = (scheduledDate - now) / 60000;

    if (diffMinutes < 10 || diffMinutes > (30 * 24 * 60)) {
      return showStatus("⚠️ Facebook rules: Schedule time must be between 10 minutes and 30 days from now.", true);
    }

    formData.append('isSchedule', 'true');
    formData.append('scheduled_publish_time', Math.floor(scheduledDate.getTime() / 1000));
  }

  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.innerText = `⏳ Publishing to ${selectedPageIds.length} page(s)...`;
  showStatus(`Broadcasting post to ${selectedPageIds.length} destination(s)... Do not close.`);

  try {
    const response = await fetch('/api/publish', {
      method: 'POST',
      body: formData
    });
    const result = await response.json();

    if (!response.ok || result.error) {
      showStatus("❌ Error: " + (result.error || "Upload failed"), true);
    } else {
      showStatus(`✅ Success! Published to ${selectedPageIds.length} page(s).`);
      fileInput.value = '';
      updateFileName();
      document.getElementById('caption').value = '';
      document.querySelectorAll('input[name="targetPages"]').forEach(cb => cb.checked = false);
    }
  } catch (error) {
    showStatus("❌ Network Error: " + error.message, true);
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerText = "🚀 Launch Post";
  }
}
</script>

</body>
</html>
