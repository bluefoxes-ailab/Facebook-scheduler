<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator Studio | Team Publisher</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #00f2fe;
      --primary-hover: #4facfe;
      --gaming: #b122e5;
      --gaming-hover: #ff63de;
      --truecrime: #ff0844;
      --truecrime-hover: #ffb199;
      
      --glass-bg: rgba(25, 25, 35, 0.6);
      --glass-border: rgba(255, 255, 255, 0.15);
      --text-main: #ffffff;
      --text-muted: #b3b3b3;
      
      --success-bg: rgba(22, 163, 74, 0.2);
      --success-border: #4ade80;
      --error-bg: rgba(220, 38, 38, 0.2);
      --error-border: #f87171;
    }

    body {
      font-family: 'Poppins', sans-serif;
      
      background: linear-gradient(-45deg, #1a0b2e, #4a1942, #890c25, #0f172a, #2e0854);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    
    .container {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 550px;
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 30px;
      font-weight: 700;
      font-size: 1.8rem;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    .hidden { display: none !important; }

    
    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .btn:hover { transform: translateY(-3px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

    .login-btns { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
    .login-btns .btn { padding: 20px; font-size: 1.1rem; }
    
    .btn-gaming { 
      background: linear-gradient(135deg, var(--gaming), var(--gaming-hover));
      box-shadow: 0 10px 20px rgba(177, 34, 229, 0.3);
    }
    .btn-gaming:hover { box-shadow: 0 15px 25px rgba(177, 34, 229, 0.5); }
    
    .btn-crime { 
      background: linear-gradient(135deg, var(--truecrime), var(--truecrime-hover));
      box-shadow: 0 10px 20px rgba(255, 8, 68, 0.3);
    }
    .btn-crime:hover { box-shadow: 0 15px 25px rgba(255, 8, 68, 0.5); }
    
    .btn-submit { 
      background: linear-gradient(135deg, var(--primary), var(--primary-hover)); 
      width: 100%; 
      margin-top: 24px;
      color: #000;
      box-shadow: 0 10px 20px rgba(0, 242, 254, 0.3);
    }
    .btn-submit:hover { box-shadow: 0 15px 25px rgba(0, 242, 254, 0.5); }
    
    .btn-back { 
      background: rgba(255,255,255,0.05); 
      color: var(--text-muted); 
      width: 100%; 
      margin-top: 15px; 
      border: 1px solid var(--glass-border); 
    }
    .btn-back:hover { background: rgba(255,255,255,0.1); color: #fff; }

    
    .form-group { margin-bottom: 24px; }
    label { 
      display: block; 
      font-weight: 500; 
      margin-bottom: 10px; 
      font-size: 0.95rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
    
    select, textarea, input[type="datetime-local"], input[type="password"] {
      width: 100%;
      padding: 16px;
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 1rem;
      color: #fff;
      background: rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }
    
    select option { background: #1a1a2e; color: #fff; }
    
    select:focus, textarea:focus, input[type="datetime-local"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(0, 0, 0, 0.5);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
    }

    textarea { 
      resize: vertical; 
      min-height: 120px; 
      line-height: 1.6; 
      padding-right: 50px; 
    }

    
    .caption-wrapper {
      position: relative;
    }
    
    .emoji-btn {
      position: absolute;
      bottom: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s ease;
      z-index: 2;
    }

    .emoji-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.1);
    }

    
    .file-upload-wrapper {
      position: relative;
      border: 2px dashed rgba(255,255,255,0.3);
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      background: rgba(0, 0, 0, 0.2);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .file-upload-wrapper:hover {
      border-color: var(--primary);
      background: rgba(0, 242, 254, 0.05);
    }
    .file-upload-wrapper input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .file-upload-text {
      color: var(--text-muted);
      font-weight: 500;
    }
    .file-upload-text span {
      display: block;
      color: var(--primary);
      font-weight: 600;
      margin-top: 8px;
      font-size: 1.1rem;
    }

   
    .radio-group { 
      display: flex; 
      gap: 20px; 
      align-items: center; 
      background: rgba(0, 0, 0, 0.2);
      padding: 18px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
    }
    .radio-group label {
      margin: 0;
      display: flex;
      align-items: center;
      cursor: pointer;
      font-weight: 500;
      color: #fff;
    }
    .radio-group input[type="radio"] {
      margin-right: 10px;
      width: 20px;
      height: 20px;
      accent-color: var(--primary);
      cursor: pointer;
    }

   
    #statusMessage {
      margin-top: 24px;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      font-weight: 600;
      font-size: 0.95rem;
      animation: slideUp 0.3s ease-out;
      backdrop-filter: blur(5px);
    }
    .success { background-color: var(--success-bg); color: #fff; border: 1px solid var(--success-border); }
    .error { background-color: var(--error-bg); color: #fff; border: 1px solid var(--error-border); }

    
    .password-container { text-align: center; }
    .password-container input { margin-bottom: 20px; text-align: center; letter-spacing: 3px; font-size: 1.2rem; }
  
    .picmo-popup {
      background-color: #1a1a2e !important; 
      border-radius: 30px !important;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8) !important;
      border: 1px solid var(--glass-border) !important;
    }

    
    picmo-picker {
      background-color: #1a1a2e !important;
    }
  
  
  </style>
</head>
<body>


<div class="container" id="loginScreen">
  <h2>Select Workspace</h2>
  <div class="login-btns">
    <button class="btn btn-gaming" onclick="requestPassword('gaming')">🎮 Gaming </button>
    <button class="btn btn-crime" onclick="requestPassword('trueCrime')">🕵️ True Crime </button>
  </div>
</div>


<div class="container hidden" id="passwordScreen">
  <div class="password-container">
    <h2 id="passwordTitle">Enter Password</h2>
    <input type="password" id="teamPassword" placeholder="••••••••" onkeyup="checkEnterKey(event)">
    <button class="btn btn-submit" onclick="verifyPassword()">Unlock Workspace</button>
    <button class="btn btn-back" onclick="resetToLogin()">Cancel</button>
    <div id="passwordError" class="hidden error" style="margin-top: 15px; padding: 10px; border-radius: 8px;">Incorrect Password</div>
  </div>
</div>


<div class="container hidden" id="composerScreen">
  <h2 id="teamTitle">Composer</h2>
  
  <div class="form-group">
    <label for="pageSelect">Select Page</label>
    <select id="pageSelect"></select>
  </div>

  <div class="form-group">
    <label>Creative Asset</label>
    <div class="file-upload-wrapper">
      <div class="file-upload-text" id="fileUploadText">
        Drag & drop or click to browse
        <span>Video or Image file</span>
      </div>
      <input type="file" id="mediaUpload" accept="image/*,video/*" onchange="updateFileName()">
    </div>
  </div>

  <div class="form-group">
    <label for="caption">Post Caption</label>
    <div class="caption-wrapper">
      <textarea id="caption" placeholder="Write something engaging..."></textarea>
      
      <button type="button" class="emoji-btn" id="emojiBtn" title="Add Emoji">😀</button>
    </div>
  </div>

  <div class="form-group radio-group">
    <label><input type="radio" name="publishType" value="now" checked onchange="toggleSchedule()"> Publish Now</label>
    <label><input type="radio" name="publishType" value="schedule" onchange="toggleSchedule()"> Schedule Post</label>
  </div>

  <div class="form-group hidden" id="scheduleGroup">
    <label for="scheduleTime">Schedule Date & Time</label>
    <input type="datetime-local" id="scheduleTime">
  </div>

  <button class="btn btn-submit" id="submitBtn" onclick="submitPost()">🚀 Launch Post</button>
  <button class="btn btn-back" onclick="resetToLogin()">Log Out / Switch Team</button>

  <div id="statusMessage" class="hidden"></div>
</div>

<script>
  
  
  

  const teamsData = {
    gaming: [
      { name: "Gamology - The Best of Gaming", id: "894332950616089"},
      { name: "Gamers on Board", id: "115642145136159" },
      { name: "Pixel Heroes", id: "158184731454410" },
      { name: "Gamer Forecast", id: "184753692121622"},
      { name: "Shift Fire", id: "104241008734361" },
      { name: "Gamology Asia", id: "1383863451698458" },
      { name: "Frags and Skills", id: "461052150760556" },
      { name: "Gamology - Creators Network +", id: "1429851870430172" },
      { name: "Sweet Memories", id: "132863274153701" }
    ],
    trueCrime: [
      { name: "Killer Bites", id: "107635881202158"},
      { name: "Binge Society - Dark", id: "111107098020809"}
    ]
  };

  let pendingTeam = "";
  let activeTeamData = [];

  


  function requestPassword(team) {
    pendingTeam = team;
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('passwordScreen').classList.remove('hidden');
    
    
    const title = team === 'gaming' ? '🎮 Gaming Login' : '🕵️ True Crime Login';
    document.getElementById('passwordTitle').innerText = title;
    
    document.getElementById('teamPassword').value = '';
    document.getElementById('passwordError').classList.add('hidden');
    document.getElementById('teamPassword').focus();
  }

  function checkEnterKey(e) {
    if (e.key === 'Enter') verifyPassword();
  }

  async function verifyPassword() {
  const input = document.getElementById('teamPassword').value;
  
  const response = await fetch('/api/verify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ team: pendingTeam, password: input })
  });

  if (response.ok) {
   
    window.currentSessionPassword = input; 
    document.getElementById('passwordScreen').classList.add('hidden');
    loadComposer(pendingTeam);
  } else {
    const errorMsg = document.getElementById('passwordError');
    errorMsg.classList.remove('hidden');
  }
}

  function resetToLogin() {
    
    document.getElementById('passwordScreen').classList.add('hidden');
    document.getElementById('composerScreen').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    
    
    document.getElementById('caption').value = '';
    
    
    document.getElementById('mediaUpload').value = '';
    updateFileName(); 
    
   
    document.getElementById('scheduleTime').value = '';
    
  
    document.querySelector('input[name="publishType"][value="now"]').checked = true;
    toggleSchedule(); 

    document.getElementById('statusMessage').classList.add('hidden');
    document.getElementById('statusMessage').textContent = '';
    
    pendingTeam = "";
  }

  let emojiPickerInstance = null;

  function loadComposer(team) {
    document.getElementById('composerScreen').classList.remove('hidden');
    
    
    document.getElementById('teamTitle').innerText = team === 'gaming' ? '🎮 Gaming Workspace' : '🕵️ True Crime Workspace';
    activeTeamData = teamsData[team];
    
   
    const pageSelect = document.getElementById('pageSelect');
    pageSelect.innerHTML = ''; 
    activeTeamData.forEach((page, index) => {
      const option = document.createElement('option');
      option.value = index; 
      option.textContent = page.name;
      pageSelect.appendChild(option);
    });

    
    if (!emojiPickerInstance) {
      const button = document.querySelector('#emojiBtn');
      const captionInput = document.querySelector('#caption');
      
     
      import('https://cdn.jsdelivr.net/npm/@picmo/popup-picker@5.8.5/+esm')
        .then(module => {
        
          emojiPickerInstance = module.createPopup(
            { 
              theme: 'dark' 
            }, 
            {
              referenceElement: button,
              triggerElement: button,
              position: 'bottom-end'
            }
          );

          
          emojiPickerInstance.addEventListener('emoji:select', selection => {
            captionInput.value += selection.emoji;
          });

          button.addEventListener('click', () => {
            emojiPickerInstance.toggle();
          });
        })
        .catch(err => console.error("Emoji picker failed to load:", err));
    }
  }

  function updateFileName() {
    const fileInput = document.getElementById('mediaUpload');
    const uploadText = document.getElementById('fileUploadText');
    if (fileInput.files.length > 0) {
      uploadText.innerHTML = `Ready to launch: <span>${fileInput.files[0].name}</span>`;
    } else {
      uploadText.innerHTML = `Drag & drop or click to browse <span>Video or Image file</span>`;
    }
  }

  function toggleSchedule() {
    const isSchedule = document.querySelector('input[name="publishType"]:checked').value === 'schedule';
    const scheduleGroup = document.getElementById('scheduleGroup');
    if (isSchedule) {
      scheduleGroup.classList.remove('hidden');
    } else {
      scheduleGroup.classList.add('hidden');
      document.getElementById('scheduleTime').value = ''; 
    }
  }

  function showStatus(message, isError = false) {
    const statusEl = document.getElementById('statusMessage');
    statusEl.textContent = message;
    statusEl.className = isError ? 'error' : 'success';
    statusEl.classList.remove('hidden');
  }

  async function submitPost() {
    const pageIndex = document.getElementById('pageSelect').value;
    const fileInput = document.getElementById('mediaUpload');
    const caption = document.getElementById('caption').value;
    const isSchedule = document.querySelector('input[name="publishType"]:checked').value === 'schedule';
    const scheduleTime = document.getElementById('scheduleTime').value;

    if (!fileInput.files.length) {
      return showStatus("⚠️ Please select a media asset to upload.", true);
    }

    const selectedPage = activeTeamData[pageIndex];
    const file = fileInput.files[0];
    const isVideo = file.type.includes('video');

    const formData = new FormData();
    formData.append('media', file); 
    formData.append('team', pendingTeam);
    formData.append('pageId', selectedPage.id);
    formData.append('caption', caption);
    formData.append('password', window.currentSessionPassword); 
    formData.append('isVideo', isVideo.toString()); 

    
    if (isSchedule) {
      if (!scheduleTime) return showStatus("⚠️ Please select a time to schedule.", true);
      
      const scheduledDate = new Date(scheduleTime);
      const now = new Date();
      const diffMinutes = (scheduledDate - now) / 60000;
      
      if (diffMinutes < 10 || diffMinutes > (30 * 24 * 60)) {
        return showStatus("⚠️ Facebook rules: Schedule time must be between 10 minutes and 30 days from now.", true);
      }
      
      formData.append('isSchedule', 'true');
      formData.append('scheduled_publish_time', Math.floor(scheduledDate.getTime() / 1000));
    }

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerText = "⏳ Beaming up to server...";
    showStatus("Uploading asset... Do not close window.");

    try {
     
      const response = await fetch('/api/publish', {
        method: 'POST',
        body: formData
      });
      const result = await response.json();

      
      if (!response.ok || result.error) {
        showStatus("❌ Error: " + (result.error || "Upload failed"), true);
      } else {
        showStatus("✅ Success! Post ID: " + result.id);
        fileInput.value = '';
        updateFileName(); 
        document.getElementById('caption').value = '';
      }
    } catch (error) {
      showStatus("❌ Network Error: " + error.message, true);
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "🚀 Launch Post";
    }
}
</script>

</body>
</html>
